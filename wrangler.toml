# Cloudflare Worker config — static assets deployment.
#
# `name` MUST match the existing Worker in your Cloudflare dashboard.
# If your Worker is named differently, change it here — otherwise this
# will create a NEW Worker instead of updating the existing one.

name = "vishwas-sutar-site"
compatibility_date = "2025-01-01"

# Serve every file in the repo root as a static asset.
# No Worker script is needed — Cloudflare handles routing directly.
[assets]
directory = "./"
not_found_handling = "404-page"
